[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llmtrack-sdk"
version = "0.1.0"
description = "Server-side SDK for tracking LLM token usage, costs, and observability data in LLMtrack"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["httpx>=0.27,<1"]
keywords = ["llm", "openai", "anthropic", "cost", "cost-tracking", "observability", "tokens", "ai"]

[project.urls]
Homepage = "https://llm-track.com"
Documentation = "https://llm-track.com/docs"
Repository = "https://github.com/llmtrack/llmtrack-sdks"
Issues = "https://github.com/llmtrack/llmtrack-sdks/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "build>=1"]

[tool.hatch.build.targets.wheel]
packages = ["src/llmtrack_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
